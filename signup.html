<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up - Cyber Shield</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Cyber Shield</h1>
        <p>Cyber Safety & Awareness Platform</p>
    </header>

    <!-- Sign Up Section -->
    <main>

        <section class="auth-section">

            <div class="auth-box">

                <h2>🛡️ Create Your Account</h2>

                <p>
                    Join Cyber Shield and improve your online safety.
                </p>

                <form id="signupForm">

                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required>

                    <label for="signupEmail">Email</label>
                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required>

                    <label for="signupPassword">Password</label>
                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required>

                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required>

                    <button type="submit">
                        Create Account
                    </button>

                </form>

                <p id="signupMessage"></p>

                <p class="auth-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

                <p class="back-home">
                    <a href="index.html">← Back to Home</a>
                </p>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 Cyber Shield | Cyber Safety Awareness Project</p>
    </footer>
<script src="signup.js"></script>
</body>

</html>
